workflows:
  ios-release:
    name: Salute Remote+ IPA
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate project
        script: xcodegen generate --spec project.yml
      - name: Build unsigned IPA
        script: |
          set -euo pipefail
          rm -rf build Payload SaluteRemotePlus.ipa
          xcodebuild -project SaluteRemotePlus.xcodeproj -scheme SaluteRemotePlus -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP_PATH="$(find build/DerivedData/Build/Products -maxdepth 2 -name 'SaluteRemotePlus.app' -type d -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/SaluteRemotePlus.app
          rm -rf Payload/SaluteRemotePlus.app/_CodeSignature
          zip -qry SaluteRemotePlus.ipa Payload
    artifacts:
      - SaluteRemotePlus.ipa
