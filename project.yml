name: RemoteSalute
options:
  bundleIdPrefix: com.local
targets:
  RemoteSalute:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [RemoteSalute]
    info:
      path: RemoteSalute/Info.plist
    settings:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      AD_HOC_CODE_SIGNING_ALLOWED: YES
      ENABLE_BITCODE: NO
