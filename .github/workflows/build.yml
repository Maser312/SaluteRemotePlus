name: Build IPA for SideStore and LiveContainer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Очистка и создание структуры .app
          rm -rf build Payload RemoteSalute.ipa
          APP_DIR="build/RemoteSalute.app"
          mkdir -p "$APP_DIR"
          
          # Компиляция исполняемого бинарника под ARM64
          swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -emit-executable \
            -O \
            -o "$APP_DIR/RemoteSalute" \
            RemoteSalute/RemoteSaluteApp.swift \
            RemoteSalute/ContentView.swift \
            RemoteSalute/NetworkManager.swift
            
          # Копирование манифеста
          cp RemoteSalute/Info.plist "$APP_DIR/Info.plist"
          
          # Обязательно: права на исполнение
          chmod +x "$APP_DIR/RemoteSalute"
          
          # Ad-hoc подпись для формирования _CodeSignature (критично для LiveContainer)
          codesign --force --deep --sign - "$APP_DIR"
          
          # Формирование структуры Payload
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          
          # Упаковка в zip с сохранением симлинков и структуры каталогов
          zip -qry RemoteSalute.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSalute
          path: RemoteSalute.ipa
