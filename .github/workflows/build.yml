name: Build IPA for SideStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/RemoteSalute.app
          
          # Компиляция Swift без Xcode-проекта напрямую под ARM64 (iPhone)
          swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -emit-executable \
            -o build/RemoteSalute.app/RemoteSalute \
            RemoteSalute/RemoteSaluteApp.swift \
            RemoteSalute/ContentView.swift \
            RemoteSalute/NetworkManager.swift
            
          # Копируем Info.plist
          cp RemoteSalute/Info.plist build/RemoteSalute.app/Info.plist
          
          # Упаковываем в IPA
          mkdir -p Payload
          cp -r build/RemoteSalute.app Payload/
          zip -r RemoteSalute.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSalute
          path: RemoteSalute.ipa
