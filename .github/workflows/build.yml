name: Build for SideStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project SaluteRemotePlus.xcodeproj -scheme SaluteRemotePlus
      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build Payload SaluteRemotePlus.ipa
          xcodebuild \
            -project SaluteRemotePlus.xcodeproj \
            -scheme SaluteRemotePlus \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find build/DerivedData/Build/Products -maxdepth 2 -name 'SaluteRemotePlus.app' -type d -print -quit)"
          test -n "$APP_PATH"

          # JazzSDK.framework has a runtime dependency on Spench.framework,
          # but the upstream SPM package does not declare Spench as a product.
          # Copy the device slice into the app's Frameworks directory so
          # dyld can resolve @rpath/Spench.framework/Spench after SideStore signing.
          SPENCH_PATH="$(find build/DerivedData -type d -path '*/Spench.xcframework/ios-arm64/Spench.framework' -print -quit)"
          test -n "$SPENCH_PATH"
          mkdir -p "$APP_PATH/Frameworks"
          rm -rf "$APP_PATH/Frameworks/Spench.framework"
          cp -R "$SPENCH_PATH" "$APP_PATH/Frameworks/Spench.framework"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/SaluteRemotePlus.app
          rm -rf Payload/SaluteRemotePlus.app/_CodeSignature
          rm -rf Payload/SaluteRemotePlus.app/Frameworks/Spench.framework/_CodeSignature
          zip -qry SaluteRemotePlus.ipa Payload
          test -s SaluteRemotePlus.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SaluteRemotePlus-IPA
          path: SaluteRemotePlus.ipa
          if-no-files-found: error
