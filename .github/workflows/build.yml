name: Build for SideStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          rm -rf build Payload RemoteSalute.ipa
          xcodebuild \
            -project RemoteSalute.xcodeproj \
            -scheme RemoteSalute \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/RemoteSalute.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/RemoteSalute.app/_CodeSignature
          zip -qry RemoteSalute.ipa Payload
          test -s RemoteSalute.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSalute
          path: RemoteSalute.ipa
          if-no-files-found: error
