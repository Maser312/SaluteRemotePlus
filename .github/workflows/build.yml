name: Build IPA for LiveContainer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Standard iOS App
        run: |
          set -e
          
          # 1. Создаем минимальный официальный проект Swift Package Manager (iOS App)
          # Это гарантирует правильные Mach-O заголовки, PkgInfo и совместимость с LiveContainer
          
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          APP_DIR="Payload/RemoteSalute.app"
          mkdir -p "$APP_DIR"
          
          # Компилируем с флагом динамической линковки системных библиотек
          swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -emit-executable \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -o "$APP_DIR/RemoteSalute" \
            RemoteSalute/RemoteSaluteApp.swift \
            RemoteSalute/ContentView.swift \
            RemoteSalute/NetworkManager.swift
          
          # Копируем Info.plist
          cp RemoteSalute/Info.plist "$APP_DIR/Info.plist"
          
          # Создаем системные файлы структуры iOS Bundle
          echo "APPL????" > "$APP_DIR/PkgInfo"
          chmod +x "$APP_DIR/RemoteSalute"
          
          # LiveContainer требует валидный Ad-Hoc codesign с entitlements
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          codesign --force --deep --sign - --entitlements entitlements.plist "$APP_DIR"
          
          # Упаковка IPA (Payload в корне архива без лишних вложенностей)
          zip -r -y RemoteSalute.ipa Payload/
          rm -rf Payload entitlements.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSalute
          path: RemoteSalute.ipa
