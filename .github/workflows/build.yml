name: Build for SideStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package for SideStore
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          rm -rf Payload RemoteSalute.app RemoteSalute.ipa
          mkdir -p Payload/RemoteSalute.app
          
          # 1. Чистая компиляция под процессор iPhone (ARM64)
          swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -O \
            -o Payload/RemoteSalute.app/RemoteSalute \
            RemoteSalute/RemoteSaluteApp.swift \
            RemoteSalute/ContentView.swift \
            RemoteSalute/NetworkManager.swift

          # 2. Копируем Info.plist и создаем PkgInfo
          cp RemoteSalute/Info.plist Payload/RemoteSalute.app/Info.plist
          printf "APPL????" > Payload/RemoteSalute.app/PkgInfo
          chmod +x Payload/RemoteSalute.app/RemoteSalute

          # 3. Упаковка в стандартный IPA для SideStore
          zip -r -y RemoteSalute.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSalute
          path: RemoteSalute.ipa
