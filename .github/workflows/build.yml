name: Build IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          rm -rf Payload RemoteSalute.app RemoteSalute.ipa
          mkdir -p Payload/RemoteSalute.app
          
          swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -O \
            -o Payload/RemoteSalute.app/RemoteSalute \
            RemoteSalute/RemoteSaluteApp.swift \
            RemoteSalute/ContentView.swift \
            RemoteSalute/NetworkManager.swift

          cp RemoteSalute/Info.plist Payload/RemoteSalute.app/Info.plist
          printf "APPL????" > Payload/RemoteSalute.app/PkgInfo
          chmod 755 Payload/RemoteSalute.app/RemoteSalute

          codesign --force --deep --sign - Payload/RemoteSalute.app

          /usr/bin/zip -r -y RemoteSalute.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSalute
          path: RemoteSalute.ipa
